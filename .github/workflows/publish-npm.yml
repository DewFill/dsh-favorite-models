name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Read the package version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already live on npm
        id: live
        run: |
          if npm view "dsh-favorite-models@${{ steps.version.outputs.value }}" version >/dev/null 2>&1; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.live.outputs.value == 'false'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Wait for the version to appear on npm
        if: steps.live.outputs.value == 'false'
        id: confirm
        run: |
          for attempt in 1 2 3 4 5 6; do
            if npm view "dsh-favorite-models@${{ steps.version.outputs.value }}" version >/dev/null 2>&1; then
              echo "value=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "value=false" >> "$GITHUB_OUTPUT"
          echo "::warning::The version is staged for review. Approve it in the npm staged-publishing queue, then run this workflow again to update the plugin index."

      - name: Point the plugin index at the npm release
        if: steps.live.outputs.value == 'true' || steps.confirm.outputs.value == 'true'
        run: node scripts/update-index.mjs "${{ steps.version.outputs.value }}"

      - name: Commit the updated index
        if: steps.live.outputs.value == 'true' || steps.confirm.outputs.value == 'true'
        run: |
          if git diff --quiet -- index.json; then
            echo "index.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "chore: index the npm release [skip ci]"
          git push
